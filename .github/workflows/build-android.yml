name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/dnd-mobile-app-ld1b0j
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK URL
        run: |
          echo "✅ Build terminé !"
          echo "👉 Va sur https://expo.dev pour télécharger ton APK"
          echo "   Ou vérifie l'onglet 'Builds' de ton projet Expo"
