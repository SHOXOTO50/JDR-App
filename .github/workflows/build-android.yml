name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/dnd-mobile-app-ld1b0j
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialiser le projet EAS (si pas encore fait)
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Lien de téléchargement
        run: |
          echo ""
          echo "✅ APK construit avec succès !"
          echo "👉 Télécharge-le sur : https://expo.dev/accounts/[ton-compte]/projects/jdr-app/builds"
          echo ""
