name: Build Android APK

on:
  push:
    branches: [main, claude/lifequest-rpg-app-or37mc]
  workflow_dispatch:

jobs:
  build:
    name: Android APK (expo prebuild + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild (génère le projet Android natif)
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Copier l'APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/LifeQuest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeQuest-APK
          path: release/LifeQuest.apk
          retention-days: 30
